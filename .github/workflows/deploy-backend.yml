name: Deploy backend
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-backend
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Pull and rebuild on server
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy root@$HOST '
            set -e
            cd /root/sabmero-repo && git pull
            cd sabmero && docker compose up -d --build
            sleep 8
            docker logs --tail 15 sabmero-api
          '
